name: MatchRV ChatGPT Plugin V1

on:
  push:
    branches:
      - chatgpt-plugin-v1
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/api-server/**"
      - "lib/agent-core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/chatgpt-plugin-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-plugin-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck, test, build, MCP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NODE_ENV: "test"
      PORT: "8080"

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "pnpm"

      - name: Install pnpm 10.33.0
        run: corepack prepare pnpm@10.33.0 --activate

      - name: Verify committed lockfile is current
        run: pnpm install --frozen-lockfile

      - name: Typecheck agent core
        run: pnpm --filter @workspace/agent-core run typecheck

      - name: Typecheck API server
        run: |
          pnpm --filter @workspace/agent-core exec tsc -b ../../lib/db ../../lib/api-zod ../../lib/integrations-anthropic-ai
          pnpm --filter @workspace/api-server run typecheck

      - name: Test agent core
        run: pnpm --filter @workspace/agent-core run test

      - name: Test API server
        run: pnpm --filter @workspace/api-server run test

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Start API server for MCP smoke test
        shell: bash
        run: |
          NODE_ENV=development DISABLE_DB=1 PORT=8080 pnpm --filter @workspace/api-server run dev > /tmp/matchrv-api.log 2>&1 &
          echo $! > /tmp/matchrv-api.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/api/healthz >/dev/null; then
              echo "MatchRV API is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/matchrv-api.log
          exit 1

      - name: Public MCP docs page (/mcp-docs)
        shell: bash
        run: |
          curl --fail --silent --show-error -D /tmp/docs.h http://127.0.0.1:8080/mcp-docs -o /tmp/docs.html
          grep -qi '^content-type: text/html' /tmp/docs.h
          for t in teach_outfitter outfitter_memory outfitter_discovery outfitter_guide search_rvs get_rv compare_rvs evaluate_tow_fit prepare_dealer_inquiry send_dealer_inquiry get_dealer_inquiry_status; do
            grep -q "id=\"$t\"" /tmp/docs.html || { echo "missing $t"; exit 1; }
          done
          if grep -qi '<script' /tmp/docs.html; then echo "docs page must not need JS"; exit 1; fi
          echo "MCP docs page OK"

      - name: Exercise MCP initialize and V1 tools
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = "http://127.0.0.1:8080/mcp";
          let sessionId;
          let nextId = 1;

          async function rpc(method, params = {}) {
            const headers = {
              "content-type": "application/json",
              "accept": "application/json, text/event-stream",
            };
            if (sessionId) headers["mcp-session-id"] = sessionId;
            const res = await fetch(endpoint, {
              method: "POST",
              headers,
              body: JSON.stringify({ jsonrpc: "2.0", id: nextId++, method, params }),
            });
            if (!res.ok) throw new Error(`${method} HTTP ${res.status}: ${await res.text()}`);
            sessionId ||= res.headers.get("mcp-session-id") || undefined;
            const body = await res.text();
            const dataLine = body.split("\n").find(line => line.startsWith("data: "));
            const payload = JSON.parse(dataLine ? dataLine.slice(6) : body);
            if (payload.error) throw new Error(`${method}: ${JSON.stringify(payload.error)}`);
            return payload.result;
          }

          function parseTool(result) {
            if (result?.isError) throw new Error(`Tool error: ${JSON.stringify(result)}`);
            const text = result?.content?.find(part => part.type === "text")?.text;
            if (!text) throw new Error(`Missing tool text result: ${JSON.stringify(result)}`);
            return JSON.parse(text);
          }

          await rpc("initialize", {
            protocolVersion: "2025-06-18",
            capabilities: {},
            clientInfo: { name: "matchrv-ci", version: "1.0.0" },
          });

          // Notification has no id and is intentionally sent separately.
          {
            const headers = { "content-type": "application/json", "accept": "application/json, text/event-stream" };
            if (sessionId) headers["mcp-session-id"] = sessionId;
            const res = await fetch(endpoint, {
              method: "POST",
              headers,
              body: JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized" }),
            });
            if (!res.ok) throw new Error(`initialized notification HTTP ${res.status}`);
          }

          const listed = await rpc("tools/list");
          const expected = ["search_rvs", "get_rv", "compare_rvs", "evaluate_tow_fit"];
          const names = new Set((listed.tools || []).map(tool => tool.name));
          for (const name of expected) {
            if (!names.has(name)) throw new Error(`Missing MCP tool: ${name}`);
          }

          const search = parseTool(await rpc("tools/call", {
            name: "search_rvs",
            // Only a verified shopper request skips the questions (v2.2.3).
            arguments: { constraints: {}, shopper_requested_results_now: true, shopper_words: "just show me", limit: 3 },
          }));
          if (!Array.isArray(search.results) || search.results.length < 2) {
            throw new Error(`Expected at least two searchable RVs: ${JSON.stringify(search)}`);
          }

          const ids = search.results.slice(0, 2).map(row => row.unit?.id || row.unit_id).filter(Boolean);
          if (ids.length < 2) throw new Error(`Search results did not expose two unit ids: ${JSON.stringify(search.results)}`);

          const detail = parseTool(await rpc("tools/call", {
            name: "get_rv",
            arguments: { unit_id: ids[0] },
          }));
          if (!detail.unit) throw new Error("get_rv returned no unit");

          const comparison = parseTool(await rpc("tools/call", {
            name: "compare_rvs",
            arguments: { unit_ids: ids, constraints: {} },
          }));
          if (!comparison.comparison) throw new Error("compare_rvs returned no comparison");

          const tow = parseTool(await rpc("tools/call", {
            name: "evaluate_tow_fit",
            arguments: { vehicle: "Ford F-150", unit_ids: [ids[0]] },
          }));
          if (!Array.isArray(tow.fits) || tow.fits.length !== 1 || !tow.safetyNotice) {
            throw new Error(`evaluate_tow_fit contract failed: ${JSON.stringify(tow)}`);
          }

          console.log(`MCP smoke test passed: ${expected.join(", ")}`);
          NODE

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/matchrv-api.log || true

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/matchrv-api.pid ]; then
            kill "$(cat /tmp/matchrv-api.pid)" 2>/dev/null || true
          fi
