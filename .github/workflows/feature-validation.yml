name: MatchRV feature validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Test MAT-39 OpenAI citation runner
        working-directory: tools/ai-visibility-audit
        run: python test_openai_citation_runner.py

      - name: Typecheck agent core
        run: pnpm typecheck:agent

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm build:web

      - name: Build API
        run: pnpm build:api
