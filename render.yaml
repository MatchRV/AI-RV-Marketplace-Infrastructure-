# One-click Render deploy for the MatchRV WebMCP demo.
# Single Node process: Express API + built SPA + embedded PGlite database.
# No external services, no secrets required.
#
# The embedded database is seeded during the BUILD, not at boot: PGlite is a
# WASM Postgres and importing 1,056 listings peaks near 715 MB. Seeding on the
# (larger) build machine keeps that spike off the instance and makes boot ~9s
# faster; the populated data directory ships with the build like any other
# build output.
#
# The instance still runs on `standard` (2 GB), not `starter` (512 MB).
# Measured locally, merely *opening* the seeded database peaks at 359 MB RSS,
# but a 512 MB instance still OOM-killed it during PGlite init: the cgroup
# limit counts page cache and mapped WASM arenas that process RSS does not.
# Treat local RSS as a floor, not a budget — 2 GB is the size that is actually
# verified to run.
services:
  - type: web
    name: matchrv-webmcp
    runtime: node
    plan: standard
    buildCommand: >-
      corepack enable && corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --filter "@workspace/api-server..." --filter "@workspace/rv-marketplace..." &&
      pnpm run build:web && pnpm run build:api && pnpm run seed:db
    startCommand: node artifacts/api-server/dist/index.cjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.0"
