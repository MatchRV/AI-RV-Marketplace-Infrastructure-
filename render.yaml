# One-click Render deploy for the MatchRV WebMCP demo.
# Single Node process: Express API + built SPA. No external services, no
# secrets, and — on the deployed instance — no database.
#
# DISABLE_DB=1 is why this fits a small instance. PGlite is a WASM Postgres
# that costs ~359 MB just to open — enough to get OOM-killed on a 512 MB box,
# because the cgroup limit also counts page cache and mapped WASM arenas that
# process RSS does not report. The WebMCP agent layer never reads the
# database (every tool serves from the in-memory snapshot), so the deployed
# demo runs without one: 112 MB peak, and the 12-step demo conversation
# passes 12/12 against it, lead flow included. The classic marketplace pages
# answer 503 here; they work normally in local dev, which keeps the embedded
# database.
services:
  - type: web
    name: matchrv-webmcp
    runtime: node
    plan: starter
    buildCommand: >-
      corepack enable && corepack prepare pnpm@10.33.0 --activate &&
      pnpm install --filter "@workspace/api-server..." --filter "@workspace/rv-marketplace..." &&
      pnpm run build:web && pnpm run build:api
    startCommand: node artifacts/api-server/dist/index.cjs
    healthCheckPath: /api/healthz
    # Persistent disk so Outfitter learning (learned tow ratings, unit
    # facts) survives redeploys. Requires a paid instance; single-instance
    # only, which this service already is. If this service was created in
    # the dashboard rather than from this blueprint, add the same disk
    # (mount /var/data, 1 GB) and env var there instead.
    disk:
      name: matchrv-learned
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LEARNED_FACTS_PATH
        value: /var/data/learned-facts.json
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DISABLE_DB
        value: "1"
